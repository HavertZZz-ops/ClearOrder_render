<div class="flex flex-wrap items-center gap-2">
    <div class="px-3 py-1.5 sm:px-4 rounded-2xl bg-slate-100/80 dark:bg-slate-800/80 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 border border-slate-200/50 dark:border-slate-700/50">
        Data Atual: {{ data_atual|date:"d/m/Y" }}
    </div>
    {% if perfil_monitor %}
    <form action="{% url 'simular_proximo_dia' %}" method="POST" class="inline">
        {% csrf_token %}
        <button type="submit" class="px-2.5 sm:px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold transition-all shadow-sm flex items-center gap-1">
            ⏩ +1 Dia
        </button>
    </form>
    {% if request.session.data_simulada %}
    <form action="{% url 'resetar_data_simulada' %}" method="POST" class="inline">
        {% csrf_token %}
        <button type="submit" title="Voltar para a data real do sistema" class="px-2.5 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold transition-all shadow-sm flex items-center gap-1 border border-slate-600">
            🔄 Hoje
        </button>
    </form>
    {% endif %}
    {% endif %}
</div>
